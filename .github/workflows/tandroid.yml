name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # === НОВЫЙ ШАГ: установка инструментов для сборки нативных библиотек ===
      # Без meson падал скрипт buildNativeDeps ("ERROR: meson is required"),
      # из-за чего boringssl не компилировался и Gradle не находил .so файлы
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson \
            ninja-build \
            cmake \
            pkg-config \
            build-essential \
            python3 \
            python3-pip \
            yasm \
            nasm \
            perl \
            autoconf \
            automake \
            libtool
          echo "--- versions ---"
          meson --version
          ninja --version
          cmake --version
          python3 --version
      # =======================================================================

      - name: Generate keystore
        run: |
          rm -f TMessagesProj/config/release.keystore
          keytool -genkeypair -v \
            -keystore TMessagesProj/config/release.keystore \
            -alias androidkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=MyMessenger, O=Me, C=RU"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: |
          ./gradlew :TMessagesProj_App:assembleAfatDebug \
            --no-daemon --stacktrace \
            -PRELEASE_KEY_PASSWORD=android \
            -PRELEASE_KEY_ALIAS=androidkey \
            -PRELEASE_STORE_PASSWORD=android
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: messenger-apk
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
